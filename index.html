<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>My Store</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Paul's Shop</h1>
      <div id="cart-total">Cart: $0</div>
    </header>

    <main class="product-grid">
      <div class="product-card">
        <img src="https://picsum.photos/150" alt="Product 1" />
        <h3>Product One</h3>
        <p>$15</p>
        <button class="add-to-cart" data-price="15">Add to Cart</button>
      </div>

      <div class="product-card">
        <img src="https://picsum.photos/150" alt="Product 2" />
        <h3>Product Two</h3>
        <p>$25</p>
        <button class="add-to-cart" data-price="25">Add to Cart</button>
      </div>

      <div class="product-card">
        <img src="https://picsum.photos/150" alt="Product 3" />
        <h3>Product Three</h3>
        <p>$40</p>
        <button class="add-to-cart" data-price="40">Add to Cart</button>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
